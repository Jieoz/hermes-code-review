name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src __init__.py
      - name: Test
        run: python -m pytest -q
      - name: Build package
        run: |
          python -m pip install build
          python -m build
          tar -tf dist/*.tar.gz | grep -q 'plugin.yaml'
          tar -tf dist/*.tar.gz | grep -q 'corpus/known_defects.json'
