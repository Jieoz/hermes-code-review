[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-code-review"
version = "0.1.1"
description = "Fail-closed independent code review plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jay Sa"}]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
hermes-code-review = "hermes_code_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
